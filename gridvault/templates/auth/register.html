{% extends 'base.html' %}

{% block title %}Register | GridVault{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block auth_content %}
    <p class="eyebrow">Operator enrollment</p>
    <h2>Join the Grid.</h2>
    <p class="auth-subtitle">Create your permanent callsign and secure Mission Console access.</p>

    <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Callsign</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" placeholder="Letters, numbers, underscores" required autofocus>

        <label for="password">Passphrase</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>

        <label for="confirm-password">Confirm passphrase</label>
        <input id="confirm-password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" placeholder="Repeat your passphrase" required>

        <button class="primary-button" type="submit">Create operator account <span aria-hidden="true">→</span></button>
    </form>

    <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
