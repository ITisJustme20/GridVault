<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GridVault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
    <main class="gridvault-layout">
        <aside class="online-panel">
            <div class="online-panel-heading">
                <h2>Online</h2>

                <span id="online-count">0</span>
            </div>

            <ul id="online-users" class="online-users"></ul>
        </aside>

        <section class="chat-container">
            <header class="chat-header">
                <div>
                    <h1>GridVault</h1>

                    <p>
                        Callsign:
                        <strong>{{ current_user.username }}</strong>
                    </p>
                </div>

                <form
                    action="{{ url_for('logout') }}"
                    method="post"
                >
                    <button type="submit">Log Out</button>
                </form>
            </header>

            <section
                id="messages"
                class="messages"
                aria-live="polite"
            >
                {% for saved_message in messages %}
                    <article
                        class="message"
                        data-message-id="{{ saved_message.id }}"
                        data-callsign="{{ saved_message.author.username }}"
                    >
                        <div class="message-heading">
                            <strong>
                                {{ saved_message.author.username }}
                            </strong>

                            <time>
                                {{ saved_message.created_at.strftime("%I:%M %p") }}
                            </time>
                        </div>

                        <p>{{ saved_message.body }}</p>

                        <small class="read-receipt"></small>
                    </article>
                {% endfor %}
            </section>

            <div
                id="typing-indicator"
                class="typing-indicator"
                aria-live="polite"
            ></div>

            <button
                id="new-messages-button"
                class="new-messages-button"
                type="button"
                hidden
            >
                New messages ↓
            </button>

            <form id="message-form" class="message-form">
                <input
                    id="message-input"
                    type="text"
                    maxlength="500"
                    placeholder="Transmit a message"
                    autocomplete="off"
                    required
                >

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <script>
        window.GRIDVAULT_CALLSIGN =
            {{ current_user.username | tojson }};
    </script>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
